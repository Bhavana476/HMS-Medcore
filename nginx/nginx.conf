events {}
http {
  # Edge rate limits: 100 req / 15 min per IP on auth endpoints (~7/min), 1000 req/min elsewhere.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=7r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=1000r/m;
  client_max_body_size 20m;
  server_tokens off;

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;

    location ~ ^/api/(login|token/refresh|signup|password-reset|verify)/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://api:8000;
    }
    location /api/ {
      limit_req zone=api burst=200 nodelay;
      proxy_pass http://api:8000;
    }
    location /admin/ { proxy_pass http://api:8000; }
    location /static/ { proxy_pass http://api:8000; }
    location / { proxy_pass http://frontend:80; }
  }
}
