name: CI
on:
  push: {branches: [main]}
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: medcore_test, POSTGRES_USER: medcore, POSTGRES_PASSWORD: medcore}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DB_ENGINE: postgres
      DB_NAME: medcore_test
      DB_USER: medcore
      DB_PASSWORD: medcore
      DB_HOST: localhost
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-jwt-signing-2026
      FIELD_ENCRYPTION_KEY: Y2ktb25seS1maWVsZC1lbmNyeXB0aW9uLWtleS0zMmI=
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r requirements.txt coverage==7.6.10
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: coverage run --source=api manage.py test api
      - run: coverage report --fail-under=70 && coverage html
      - uses: actions/upload-artifact@v4
        with: {name: backend-coverage, path: backend/htmlcov}
      - run: python manage.py spectacular --file openapi.yml
      - uses: actions/upload-artifact@v4
        with: {name: openapi-schema, path: backend/openapi.yml}

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env: {PYTHON: python}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: playwright-report, path: frontend/playwright-report}

  docker:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t medcore-api ./backend
      - run: docker build -t medcore-frontend ./frontend
